[package]
name = "greviewer"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A desktop code-review tool for Git commits, written in Rust on top of gpui."
repository = "https://gitlab.cicd.dc/justin.ellison/greviewer"

[dependencies]
git2 = "0.20"
gpui = "0.2"
gpui-component = { version = "0.5", features = ["tree-sitter-languages"] }
include_dir = "0.7"
ropey = "2.0.0-beta.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
# ureq 3.x: pure-blocking HTTP client with no async runtime, used only by
# src/bitbucket to reach the Bitbucket Data Center REST API. `platform-verifier`
# routes TLS through the OS trust store. MIT/Apache-2.0 — compatible with ADR-0001.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }
uuid = { version = "1", features = ["v4"] }
futures = "0.3"

[dev-dependencies]
gpui = { version = "0.2", features = ["test-support"] }
tempfile = "3"
